name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nebula-extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Obter fonte oficial do compilador
        uses: actions/checkout@v4
        with:
          repository: korczaktech/Nebula
          ref: 9f601aa5bc34d598100d7f9ec606f94ba4f8b623
          path: .nebula-source
      - name: Compilar e incorporar CLI nativo
        run: npm run build:native
      - name: Testar runtime interativo incorporado
        run: node scripts/test-runtime.mjs bin/linux-x64/nebula
      - name: Testar protocolo real do servidor incorporado
        env:
          NEBULA_LSP_PATH: bin/linux-x64/nebula-lsp
        run: npm run test:lsp
      - name: Instalar dependências da extensão
        run: npm install --no-audit --no-fund
      - name: Testes unitários
        run: npm test
      - name: Verificar tipos
        run: npm run check-types
      - name: Compilar extensão
        run: npm run compile
      - name: Verificar artefatos
        run: npm run check-output
      - name: Testes de integração no VS Code
        run: xvfb-run -a npm run test:integration
      - name: Empacotar e validar VSIX
        run: npm run package:ci
      - name: Publicar artefato VSIX
        uses: actions/upload-artifact@v4
        with:
          name: nbx-language-vsix
          path: nbx-language.vsix
          if-no-files-found: error
          retention-days: 14
