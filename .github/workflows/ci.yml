name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check-types
      - run: npm run compile
      - run: npm run check-output
      - name: Testes de integração no VS Code
        run: xvfb-run -a npm run test:integration
      - name: Empacotar e validar VSIX
        run: npm run package:ci
      - name: Publicar artefato VSIX
        uses: actions/upload-artifact@v4
        with:
          name: nbx-language-vsix
          path: nbx-language.vsix
          if-no-files-found: error
          retention-days: 14
