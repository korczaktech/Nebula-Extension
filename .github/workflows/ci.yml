name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Compilar servidor LSP oficial
        run: cargo install --git https://github.com/korczaktech/Nebula --locked --root "$RUNNER_TEMP/nebula-lsp" nebula-lsp
      - name: Testar protocolo real do servidor
        env:
          NEBULA_LSP_PATH: ${{ runner.temp }}/nebula-lsp/bin/nebula-lsp
        run: npm run test:lsp
      - name: Instalar dependências da extensão
        run: npm install --no-audit --no-fund
      - name: Testes unitários
        run: npm test
      - name: Verificar tipos
        run: npm run check-types
      - name: Compilar extensão
        run: npm run compile
      - name: Verificar artefatos
        run: npm run check-output
      - name: Testes de integração no VS Code
        run: xvfb-run -a npm run test:integration
      - name: Empacotar e validar VSIX
        run: npm run package:ci
      - name: Publicar artefato VSIX
        uses: actions/upload-artifact@v4
        with:
          name: nbx-language-vsix
          path: nbx-language.vsix
          if-no-files-found: error
          retention-days: 14
